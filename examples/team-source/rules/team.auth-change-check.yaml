id: team.auth-change-check
name: 鉴权变更必须确认影响范围
category: security
severity: must
appliesTo:
  targets:
    - generic
    - claude
    - cursor
  stacks:
    - spring-boot
    - java
content:
  zh-CN: |
    涉及登录、登出、权限、角色、组织、数据范围、token、cookie、session 的修改，必须先说明影响范围。
    不要在修复单点问题时顺手重写认证授权流程。
    如发现更大的安全问题，只说明建议，不要直接扩大修改范围。
